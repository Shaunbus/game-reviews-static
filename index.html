---
layout: default
---

<h1>Muh Game Reviews</h1>

<div class="game-grid">
{% for game in site.data.reviews %}
    <div class="game-card
        {% if game.MyRating > 10 %}goat
        {% endif %}">

        <img class="game-cover"
        src="{{ '/assets/images/' | append: game.Slug | append: '.png' | relative_url }}"
        alt="{{ game.name }}">
        
        <h2>{{ game.Name }}</h2>
        
        <div class="rating">
            {% if game.MyRating > 10 %} 🐐
            {% else %} ⭐
            {% endif %}
            {{ game.MyRating }}
        </div>

        <div>
            🎮 {{ game.System }}
        </div>

        <div>
            ✅ {{ game.DateCompleted }}
        </div>
        
    </div> 
{% endfor %}
</div>
