---
layout: default
---

<h1>Game Reviews</h1>

<div class="game-grid">
{% for game in site.data.reviews %}
    <div class="game-card">
        <img class="game-cover"
        src="{{ game.image }}"
        alt="{{ game.name }}">
        
        <h2>{{ game.name }}</h2>
        
        <div class="rating">
            ⭐ {{ game.rating }}
        </div>

        <div>
            🎮 {{ game.system }}
        </div>

        <div>
            ✅ {{ game.date }}
        </div>
        
    </div>
    
{% endfor %}
</div>
